# Offline model hints for `vraptor ai setup`, analysis token budgets and effort
# prompts. This is not an allowlist: any other model ID or Azure deployment name
# is accepted and keeps saved or application budgets until its limits are given.
# Token limits are the providers' published figures; update `checked` with them.
#
# models:  exact IDs (plus dated `snapshots`) with published limits. Entries with
#          a `purpose` are also listed as setup examples.
# efforts: effort ladders; the first entry whose `ids` or `prefixes` match wins.
#          An empty ladder means the model takes no effort setting. Unmatched
#          models keep free-form effort input. `adaptive_thinking = false`
#          sends Claude effort without adaptive thinking.
# claude_code_200k: the Claude Code route's limits for larger models without
#          1M context: models marked `claude_code_1m_variant` unless the ID ends
#          in `[1m]`, and every model when CLAUDE_CODE_DISABLE_1M_CONTEXT is set.
checked = "2026-10-30"

[providers.openai]
label = "OpenAI"
source = "https://developers.openai.com/api/docs/models/{model}"
pricing_source = "https://developers.openai.com/api/docs/models/{model}"

[[providers.openai.efforts]]
label = "GPT-6 Astra, GPT-6.1 Sol"
prefixes = ["gpt-6-astra", "gpt-6.1-sol"]
levels = ["low", "medium", "high", "xhigh", "max"]

[[providers.openai.efforts]]
label = "GPT-6.1 Terra, GPT-6 Sol/Luna and GPT-5.6"
prefixes = ["gpt-6.1-terra", "gpt-6-sol", "gpt-6-luna", "gpt-5.6"]
levels = ["none", "low", "medium", "high", "xhigh", "max"]

[[providers.openai.efforts]]
label = "GPT-5"
ids = ["gpt-5"]
prefixes = ["gpt-5-2025-"]
levels = ["minimal", "low", "medium", "high"]

# Prompts over 272000 input tokens are billed at long-context rates.
[[providers.openai.models]]
id = "gpt-6-astra"
purpose = "Demanding reasoning and complex workflows"
context_tokens = 1050000
standard_price_input_ceiling = 272000
max_output_tokens = 128000

