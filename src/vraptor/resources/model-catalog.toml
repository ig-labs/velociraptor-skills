[providers.anthropic]
label = "Claude / Anthropic"
source = "https://platform.claude.com/docs/en/about-claude/models/overview"
pricing_source = "https://platform.claude.com/docs/en/about-claude/pricing"

# Claude Code aliases on the Anthropic API
# (https://code.claude.com/docs/en/model-config). Execution keeps the alias;
# budgets and effort use the model it names. Remapped aliases can differ.
[providers.anthropic.aliases]
sonnet = "claude-sonnet-5-5"
opus = "claude-opus-5-5"
haiku = "claude-haiku-5-5"
fable = "claude-fable-5-1"
# Opus 5.5 where Fable is unavailable; both have the same limits and efforts.
best = "claude-fable-5-1"
# Already the native 1M window of Sonnet/Opus 5.5.
"sonnet[1m]" = "claude-sonnet-5-5"
"opus[1m]" = "claude-opus-5-5"
# Opus plans and Sonnet executes; analysis requests are execution.
opusplan = "claude-sonnet-5-5"

# Claude Code's window without 1M context
# (https://code.claude.com/docs/en/model-config). Leaves 16000 tokens
# unallocated, as for Haiku 4.5; explicit input max allows 136000.
[providers.anthropic.claude_code_200k]
context_tokens = 200000
standard_price_input_ceiling = 200000
output_budget_tokens = 64000
input_budget_tokens = 120000

[[providers.anthropic.efforts]]
label = "Fable 5/5.1, Opus 5/5.5, Sonnet 5/5.5, Haiku 5.5, Opus 4.7/4.8"
prefixes = ["claude-fable-5", "claude-opus-5", "claude-sonnet-5", "claude-haiku-5", "claude-opus-4-7", "claude-opus-4-8"]
levels = ["low", "medium", "high", "xhigh", "max"]

[[providers.anthropic.efforts]]
label = "Opus/Sonnet 4.6"
prefixes = ["claude-opus-4-6", "claude-sonnet-4-6"]
levels = ["low", "medium", "high", "max"]

# Adaptive thinking starts with Claude 4.6; Opus 4.5 takes effort without it.
[[providers.anthropic.efforts]]
label = "Opus 4.5"
prefixes = ["claude-opus-4-5"]
levels = ["low", "medium", "high"]
adaptive_thinking = false

# No effort parameter: setup rejects one and runtime drops inherited values.
[[providers.anthropic.efforts]]
label = "Haiku 4.5"
prefixes = ["claude-haiku-4-5"]
levels = []

# Claude 4.6 and later include the full context at standard prices, except
# Haiku 5.5: prompts over 100000 tokens (cache included) use its higher rates.
[[providers.anthropic.models]]
id = "claude-haiku-5-5"
purpose = "Fast extraction and simple classification"
context_tokens = 1000000
standard_price_input_ceiling = 100000
max_output_tokens = 128000

[[providers.anthropic.models]]
