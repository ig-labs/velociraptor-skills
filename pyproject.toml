[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vraptor"
version = "0.1.0"
description = "Velociraptor operations and analysis"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=43.0.0", "google-re2>=1.1,<2", "jsonschema>=4.25.0",
  "PyYAML>=6.0.2", "grpcio>=1.80.0", "pyvelociraptor==0.1.14", "tiktoken>=0.7.0",
]

[project.optional-dependencies]
ai = ["openai>=2.26.0"]
azure = ["openai>=2.26.0", "azure-identity>=1.25.0"]
# SDK 1.x uses httpx2; this adapter constructs httpx timeouts.
anthropic = ["anthropic>=0.86.0,<1"]
claude = ["claude-agent-sdk>=0.2.140"]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
vraptor = "vraptor.cli:main"
dfir = "vraptor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
vraptor = ["resources/**/*", "resources/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo", "**/*.lock", "**/*.sqlite-journal", "**/*.sqlite-shm", "**/*.sqlite-wal", "**/backups/*"]
